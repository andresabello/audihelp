services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: audihelp_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - audihelp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PHP_IDE_CONFIG=serverName=audihelp

  nginx:
    image: nginx:1.25-alpine
    container_name: audihelp_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9013}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - audihelp
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: audihelp_db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5403}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-audihelp}
      POSTGRES_USER: ${DB_USERNAME:-audihelp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - audihelp_db:/var/lib/postgresql/data
    networks:
      - audihelp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-audihelp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16-alpine
    container_name: audihelp_db_test
    restart: unless-stopped
    ports:
      - "${DB_TEST_PORT:-5503}:5432"
    environment:
      POSTGRES_DB: audihelp_test
      POSTGRES_USER: ${DB_USERNAME:-audihelp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - audihelp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-audihelp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audihelp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6303}:6379"
    networks:
      - audihelp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: audihelp_scheduler
    restart: unless-stopped
    command: sh -c "php artisan package:discover --ansi && php artisan schedule:work"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - audihelp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  audihelp:
    driver: bridge

volumes:
  audihelp_db:
  vendor_data:
